name: Daily Supabase Backup
on:
  schedule:
    # 每天台北時間 04:00 (UTC 20:00) 執行
    - cron: '0 20 * * *'
  workflow_dispatch: # 允許手動觸發
jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Run backup script
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: node scripts/backup.js
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git config --local core.quotepath false

          TODAY=$(date +'%Y-%m-%d')

          # 把備份存到 /tmp 的日期子資料夾
          if [ -d "backups" ]; then
            mkdir -p /tmp/backups_temp/${TODAY}
            cp -r backups/* /tmp/backups_temp/${TODAY}/
          else
            echo "找不到 backups 資料夾，結束"
            exit 1
          fi

          # 切換到 backups 分支並同步遠端
          git fetch origin backups
          git checkout backups
          git reset --hard origin/backups

          # 還原備份到日期資料夾
          mkdir -p backups/${TODAY}
          cp -r /tmp/backups_temp/${TODAY}/* backups/${TODAY}/

          # 檢查是否有變動
          git add backups/
          if git diff --staged --quiet; then
            echo "數據無變動，無需提交。"
          else
            git commit -m "Auto-backup: ${TODAY}"
            git push origin backups
          fi
