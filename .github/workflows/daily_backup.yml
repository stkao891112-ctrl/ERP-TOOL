name: Daily Supabase Backup

on:
  schedule:
    # 每天台北時間 04:00 (UTC 20:00) 執行
    - cron: '0 20 * * *'
  workflow_dispatch: # 允許手動觸發

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 # 抓取完整歷史，這對 rebase 很重要

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # 回到 20 比較穩，那些警告只是警告，不影響執行

      - name: Install dependencies
        run: npm ci

      - name: Run backup script
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: node scripts/backup.js

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git config --local core.quotepath false
          
          # 備份生成的資料夾
          if [ -d "backups" ]; then
            cp -r backups /tmp/backups_temp
          fi
          
          # 切換到 backup 分支
          git fetch origin backup || git branch backup
          git checkout backup || git checkout -b backup
          
          # 從暫存區帶回備份資料
          if [ -d "/tmp/backups_temp" ]; then
            mkdir -p backups
            cp -r /tmp/backups_temp/* backups/
          fi
          
          # 檢查是否有變動
          git add backups/
          
          if git diff --staged --quiet; then
            echo "數據無變動，無需提交。"
          else
            # 提交變動
            git commit -m "Auto-backup: $(date +'%Y-%m-%d %H:%M:%S')"
            
            # 推送到 backup 分支
            git push origin backup
          fi
